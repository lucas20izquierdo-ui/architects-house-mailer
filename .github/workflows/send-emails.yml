name: Send guest emails

on:
  schedule:
    # Cada 5 minutos, las 24 horas del día. 5 minutos es el intervalo más
    # corto que permite GitHub: así la confirmación de una reserva sale
    # casi al momento, sea la hora que sea (incluida la madrugada).
    # Los calendarios, en cambio, se sincronizan una vez por hora:
    # no tiene sentido descargar los de Airbnb/Booking 288 veces al día.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_all:
        description: 'Prueba: enviar los 7 correos (confirm, before, checkin, during, departure, after, review)'
        type: boolean
        default: false
      force:
        description: 'Enviar ahora: ignora la espera anti-duplicados y sincroniza los calendarios'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configuration
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:       ${{ secrets.FROM_EMAIL }}
        run: timeout 180 python send_emails.py --check

      # ¿Le toca sincronizar los calendarios? Solo los 8 primeros minutos de
      # cada hora (una vez por hora) o si lo pides al lanzarlo a mano.
      - name: Decide whether to sync calendars
        id: ical
        run: echo "toca=$([ $(date +\%M) -lt 8 ] && echo si || echo no)" >> $GITHUB_OUTPUT

      - name: Send scheduled emails
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:       ${{ secrets.FROM_EMAIL }}
          REPLY_TO:         ${{ secrets.REPLY_TO }}
          SITE_URL:         ${{ vars.SITE_URL }}
          DRY_RUN:          ${{ vars.DRY_RUN }}
          TEST_TO:          ${{ vars.TEST_TO }}
          LOGO_URL:         ${{ vars.LOGO_URL }}
          FORCE:            ${{ github.event.inputs.force }}
        run: |
          if [ "${{ inputs.test_all }}" = "true" ]; then
            timeout 300 python send_emails.py --test-all
          else
            timeout 300 python send_emails.py
          fi

      # --- Calendarios iCal -------------------------------------------------
      # Importa el calendario de Airbnb / Booking.com y bloquea esas fechas
      # en la web; y publica en ical/ el calendario de tus reservas.
      - name: Sync iCal calendars
        if: steps.ical.outputs.toca == 'si' || github.event.inputs.force == 'true'
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
  if [ "${{ github.event.inputs.force }}" = "true" ]; then
    timeout 900 python ical_sync.py --prices
  else
    timeout 900 python ical_sync.py
  fi

      - name: Publish iCal feeds
        if: steps.ical.outputs.toca == 'si' || github.event.inputs.force == 'true'
        run: |
          git config user.name  "AH iCal bot"
          git config user.email "ical@architectshouse.local"
          git add -A ical
          if git diff --cached --quiet; then
            echo "Los calendarios no han cambiado."
          else
            git commit -m "Actualizar calendarios iCal"
            git push
          fi
