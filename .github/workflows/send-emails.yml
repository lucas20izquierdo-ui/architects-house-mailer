name: Send guest emails

on:
  schedule:
    # UTC: de 06:10 a 20:10 -> 08:10-22:10 en verano, 07:10-21:10 en invierno (hora Suiza)
    - cron: '10 6-20 * * *'
  workflow_dispatch:
    inputs:
      test_all:
        description: 'Probar: enviar los 7 correos (confirm, before, checkin, during, departure, after, review)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check configuration
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:       ${{ secrets.FROM_EMAIL }}
        run: timeout 180 python send_emails.py --check

      - name: Send scheduled emails
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:       ${{ secrets.FROM_EMAIL }}
          REPLY_TO:         ${{ secrets.REPLY_TO }}
          SITE_URL:         ${{ vars.SITE_URL }}
          DRY_RUN:          ${{ vars.DRY_RUN }}
          TEST_TO:          ${{ vars.TEST_TO }}
          LOGO_URL:         ${{ vars.LOGO_URL }}
        run: |
          if [ "${{ inputs.test_all }}" = "true" ]; then
            timeout 300 python send_emails.py --test-all
          else
            timeout 300 python send_emails.py
          fi

      # --- Calendarios iCal -------------------------------------------------
      # Importa el calendario de Airbnb / Booking.com y bloquea esas fechas
      # en la web; y publica en ical/ el calendario de tus reservas.
      - name: Sync iCal calendars
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: timeout 180 python ical_sync.py

      - name: Publish iCal feeds
        run: |
          git config user.name  "AH iCal bot"
          git config user.email "ical@architectshouse.local"
          git add -A ical
          if git diff --cached --quiet; then
            echo "Los calendarios no han cambiado."
          else
            git commit -m "Actualizar calendarios iCal"
            git push
          fi
